<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гирлянда MELK</title>
<style>
:root{--bg:#14161c;--card:#1d2029;--tx:#eef0f4;--mut:#8b91a1;--ac:#4cc9f0;--line:#2c3040}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;max-width:520px;margin-inline:auto}
h1{font-size:20px;margin:0 0 12px}
section{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
button{background:var(--line);color:var(--tx);border:0;border-radius:8px;padding:12px;font-size:15px;min-height:44px}
button.main{background:var(--ac);color:#06202a;font-weight:700;width:100%}
button:active{opacity:.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
input[type=range]{width:100%;margin:6px 0 12px}
input[type=color]{width:100%;height:56px;border:0;background:none;padding:0}
input[type=text],input[type=number]{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px}
.sw{height:44px;border-radius:8px;border:0}
#st{color:var(--mut);margin:0 0 10px;font-size:14px}
#log{font:12px monospace;color:var(--mut);max-height:140px;overflow:auto;white-space:pre-wrap}
.off{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<h1>Гирлянда MELK</h1>
<p id="st">Не подключено. Закрой Lotus Lamp X и нажми кнопку.</p>
<button class="main" id="conn">Подключиться</button>

<div id="ctl" class="off">
<section style="margin-top:12px">
  <div class="row"><button id="on">Включить</button><button id="offb">Выключить</button></div>
</section>

<section>
  <h2>Цвет</h2>
  <input type="color" id="col" value="#ff0000">
  <div class="row" style="margin-top:10px" id="presets"></div>
</section>

<section>
  <h2>Яркость: <span id="bv">100</span>%</h2>
  <input type="range" id="br" min="0" max="100" value="100">
  <h2>Скорость эффекта: <span id="sv">50</span>%</h2>
  <input type="range" id="sp" min="0" max="100" value="50">
</section>

<section>
  <h2>Эффект (номер подбирается вручную)</h2>
  <div class="row">
    <button id="mp">−</button>
    <input type="number" id="mode" value="128" min="0" max="255">
    <button id="mn">+</button>
  </div>
  <p style="color:var(--mut);font-size:13px;margin:8px 0 0">Нажимай + и смотри, что делает гирлянда. Номера, которые понравились, запиши.</p>
</section>

<section>
  <h2>Своя команда (hex)</h2>
  <input type="text" id="raw" value="7e070503ff000010ef">
  <button style="width:100%;margin-top:8px" id="send">Отправить</button>
</section>
</div>

<section><h2>Журнал</h2><div id="log"></div></section>

<script>
const $=id=>document.getElementById(id);
let ch=null,dev=null,busy=Promise.resolve();
const log=t=>{$('log').textContent=t+'\n'+$('log').textContent};
const hex=s=>Uint8Array.from(s.replace(/[^0-9a-f]/gi,'').match(/../g)||[],h=>parseInt(h,16));
const h2=n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0');

function send(bytes){
  if(typeof bytes==='string')bytes=hex(bytes);
  if(!ch)return;
  busy=busy.then(async()=>{
    try{
      if(ch.writeValueWithoutResponse)await ch.writeValueWithoutResponse(bytes);
      else await ch.writeValue(bytes);
      log('→ '+[...bytes].map(b=>h2(b)).join(''));
    }catch(e){log('Ошибка записи: '+e.message)}
  });
  return busy;
}

async function connect(){
  if(!navigator.bluetooth){$('st').textContent='Web Bluetooth недоступен. Открой страницу в Chrome по https-ссылке.';return}
  try{
    dev=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'MELK'},{services:[0xfff0]}],
      optionalServices:[0xfff0]
    });
    dev.addEventListener('gattserverdisconnected',()=>{ch=null;$('ctl').classList.add('off');$('st').textContent='Отключено';$('conn').textContent='Подключиться'});
    $('st').textContent='Подключаюсь…';
    const srv=await dev.gatt.connect();
    const svc=await srv.getPrimaryService(0xfff0);
    const chars=await svc.getCharacteristics();
    log('Характеристики: '+chars.map(c=>c.uuid.slice(4,8)+(c.properties.write?'W':'')+(c.properties.writeWithoutResponse?'w':'')).join(' '));
    ch=chars.find(c=>c.uuid.startsWith('0000fff3'))||chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
    if(!ch)throw new Error('нет характеристики для записи');
    log('Пишу в '+ch.uuid.slice(4,8));
    await send('7e0783');await send('7e0404');
    $('st').textContent='Подключено: '+dev.name;
    $('conn').textContent='Переподключиться';
    $('ctl').classList.remove('off');
  }catch(e){$('st').textContent='Не удалось: '+e.message;log(e.message)}
}

const color=(r,g,b)=>send('7e070503'+h2(r)+h2(g)+h2(b)+'10ef');
$('conn').onclick=connect;
$('on').onclick=()=>send('7e0404f00001ff00ef');
$('offb').onclick=()=>send('7e0404000000ff00ef');
$('col').oninput=e=>{const v=e.target.value;color(parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16))};
$('br').oninput=e=>{$('bv').textContent=e.target.value;send('7e0401'+h2(e.target.value)+'01ffff00ef')};
$('sp').oninput=e=>{$('sv').textContent=e.target.value;send('7e0402'+h2(e.target.value)+'ffffff00ef')};
const setMode=()=>send('7e0503'+h2($('mode').value)+'06ffff00ef');
$('mode').onchange=setMode;
$('mp').onclick=()=>{$('mode').value=Math.max(0,+$('mode').value-1);setMode()};
$('mn').onclick=()=>{$('mode').value=Math.min(255,+$('mode').value+1);setMode()};
$('send').onclick=()=>send($('raw').value);
[['#ff0000',255,0,0],['#00ff00',0,255,0],['#0000ff',0,0,255],['#ffffff',255,255,255],['#ff8800',255,136,0],['#aa00ff',170,0,255]].forEach(([c,r,g,b])=>{
  const x=document.createElement('button');x.className='sw';x.style.background=c;x.onclick=()=>color(r,g,b);$('presets').appendChild(x)});
</script>
</body>
</html>
